<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Medición de ozono</title>

    <link
        rel="stylesheet"
        href="./styles.css"
    >
</head>

<body>

    <main class="contenedor">

        <header class="cabecera">

            <img
                src="./img/icono-medicion.svg"
                alt=""
                class="icono-cabecera"
            >

            <h1>
                MEDICIÓN OZONO
            </h1>

        </header>

        <section
            class="medicion"
            aria-live="polite"
        >

            <div class="etiqueta-valor">
                VALOR
            </div>

            <div class="fila-valor">

                <span
                    id="valor-medicion"
                    class="valor-medicion"
                >
                    --
                </span>

                <span class="unidad">
                    ppm
                </span>

            </div>

            <div class="fila-fecha">

                <div class="zona-etiqueta-fecha">

                    <img
                        src="./img/icono-fecha.svg"
                        alt=""
                        class="icono-fecha"
                    >

                    <span class="texto-fecha">
                        Fecha y hora
                    </span>

                    <div class="linea-fecha"></div>

                </div>

                <div
                    id="fecha-medicion"
                    class="fecha-medicion"
                >
                    --
                </div>

            </div>

            <p
                id="mensaje-estado"
                class="mensaje-estado"
            ></p>

            <button
                id="boton-actualizar"
                type="button"
            >
                ACTUALIZAR
            </button>

        </section>

    </main>

    <script
        type="module"
        src="./app.js"
    ></script>

</body>

</html>
